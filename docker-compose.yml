services:
  slink-import:
    image: ghcr.io/love-not-found/slink-import:latest
    container_name: slink-import
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      # Public address of your Slink instance (also sent as the Origin header)
      SLINK_URL: ${SLINK_URL:?set SLINK_URL, e.g. https://i.hellish.dev}
      # Slink API key (Profile -> API Keys)
      SLINK_API_KEY: ${SLINK_API_KEY:?set SLINK_API_KEY}
      # Password for the web UI
      UI_PASSWORD: ${UI_PASSWORD:?set UI_PASSWORD}
      # Keeps you logged in across restarts; any long random string (openssl rand -hex 32)
      SESSION_SECRET: ${SESSION_SECRET:-}
      PORT: ${PORT:-8080}
      # Path the UI is served under; must match the nginx location
      BASE_PATH: ${BASE_PATH:-/import}
      WORKERS: ${WORKERS:-4}
      DEFAULT_PUBLIC: ${DEFAULT_PUBLIC:-false}
      DEFAULT_COLLECTION: ${DEFAULT_COLLECTION:-}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-50}
    volumes:
      - slink-import-data:/data

volumes:
  slink-import-data:

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slink importer</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main>
    <header>
      <h1>Slink importer</h1>
      <div class="actions" style="margin: 0">
        <a class="button" id="slink-link" href="#" target="_blank" rel="noopener">Open Slink</a>
        <button id="logout">Log out</button>
      </div>
    </header>

    <form class="panel" id="import-form">
      <label for="account-select">Upload as</label>
      <div class="row account-row">
        <select id="account-select"></select>
        <button type="button" id="manage-accounts" aria-expanded="false">Manage accounts</button>
      </div>

      <div class="subpanel" id="accounts-panel" hidden>
        <h3>Accounts</h3>
        <p class="hint">Each account is a Slink API key (Slink → Profile → API Keys). Keys are stored on the server and never shown again.</p>
        <ul class="collection-list" id="account-list"></ul>
        <div class="row">
          <input type="text" id="new-account-name" placeholder="Name, e.g. Personal" maxlength="100">
          <input type="password" id="new-account-key" placeholder="API key (sk_…)" autocomplete="off">
          <button type="button" id="add-account">Save</button>
        </div>
        <span class="error" id="account-error"></span>
      </div>

      <label for="links" class="spaced-label">Image links <span class="hint">one direct link per line, lines starting with # are ignored</span></label>
      <textarea id="links" placeholder="https://i.postimg.cc/xxxxxxxx/image.jpg" required></textarea>

      <div class="grid">
        <div>
          <label>Visibility</label>
          <div class="segmented">
            <input type="radio" name="visibility" id="private" value="private" checked><label for="private">Private</label>
            <input type="radio" name="visibility" id="public" value="public"><label for="public">Public</label>
          </div>
        </div>
        <div>
          <label for="collection-select">Collection <span class="hint">optional</span></label>
          <div class="row">
            <select id="collection-select"></select>
            <button type="button" id="manage-collections" aria-expanded="false">Manage</button>
          </div>
          <input type="text" id="collection" class="spaced" placeholder="Paste collection link or ID" hidden>
        </div>
        <div>
          <label for="description">Description <span class="hint">optional</span></label>
          <input type="text" id="description" maxlength="255" placeholder="e.g. Imported from {url}">
        </div>
        <div>
          <label for="workers">Parallel uploads</label>
          <input type="number" id="workers" min="1">
        </div>
      </div>

      <div class="subpanel" id="collections-panel" hidden>
        <h3>Saved collections for <span id="collections-account-name"></span></h3>
        <ul class="collection-list" id="collection-list"></ul>
        <div class="row">
          <input type="text" id="new-collection-name" placeholder="Name" maxlength="100">
          <input type="text" id="new-collection-link" placeholder="https://…/collection/&lt;id&gt;">
          <button type="button" id="add-collection">Save</button>
        </div>
        <span class="error" id="collection-error"></span>
      </div>

      <div class="actions">
        <button class="primary" type="submit" id="submit">Import</button>
        <label class="check"><input type="checkbox" id="force"> Re-upload links that were already imported</label>
        <span class="error" id="form-error"></span>
      </div>
    </form>

    <section class="panel" id="job" hidden>
      <h2 id="job-title"></h2>
      <div class="bar"><div id="job-bar"></div></div>
      <div class="summary" id="job-summary"></div>
      <div class="actions">
        <button id="retry" hidden>Retry failed</button>
        <a class="button" id="download-failed" hidden>Download failed-links.txt</a>
        <button id="copy-urls" hidden>Copy Slink URLs</button>
        <span class="error" id="job-error"></span>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Status</th><th>Link</th><th>Slink</th></tr></thead>
          <tbody id="job-items"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>History</h2>
      <ul class="history" id="history"><li class="hint">No imports yet</li></ul>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const STATUS_LABEL = { ok: "OK", failed: "Failed", running: "Uploading", pending: "Waiting", skipped: "Skipped" };
    const OTHER = "__other";
    let currentJob = null;
    let pollTimer = null;
    let savedCollections = [];
    let accounts = [];
    let defaultCollection = "";

    function selectedAccount() {
      return $("account-select").value;
    }

    function accountName(id) {
      if (!id) return "";
      const found = accounts.find((a) => a.id === id);
      return found ? found.name : "removed account";
    }

    function accountCollections() {
      return savedCollections.filter((c) => c.account === selectedAccount());
    }

    function rememberedCollection() {
      const account = selectedAccount();
      const stored = localStorage.getItem(`collection:${account}`);
      if (stored !== null) return stored;
      // Before accounts existed, the last collection was stored under one key
      if (account === "default") return localStorage.getItem("collection") ?? defaultCollection;
      return "";
    }

    function renderAccounts() {
      const current = selectedAccount() || localStorage.getItem("account");
      $("account-select").replaceChildren(...(accounts.length
        ? accounts.map((a) => el("option", { value: a.id }, a.name))
        : [el("option", { value: "" }, "No accounts yet, add one with Manage accounts")]));
      if (accounts.some((a) => a.id === current)) $("account-select").value = current;
      $("account-select").disabled = !accounts.length;
      $("submit").disabled = !accounts.length;

      $("account-list").replaceChildren(...(accounts.length ? accounts.map((a) => {
        const details = el("span", {}, el("b", {}, a.name),
          el("small", {}, a.builtin ? `${a.keyHint} · from SLINK_API_KEY` : a.keyHint));
        if (a.builtin) return el("li", {}, details);
        const remove = el("button", { type: "button", className: "small", title: `Remove ${a.name}` }, "Remove");
        remove.addEventListener("click", async () => {
          if (!confirm(`Remove account "${a.name}"? Its saved collections and import history are removed too. Images already in Slink are not affected.`)) return;
          try {
            await api(`accounts/${a.id}`, { method: "DELETE" });
            await loadAccounts();
          } catch (err) {
            $("account-error").textContent = err.message;
          }
        });
        return el("li", {}, details, remove);
      }) : [el("li", { className: "hint" }, "None saved yet")]));
    }

    async function loadAccounts() {
      accounts = await api("accounts");
      renderAccounts();
      await loadCollections(rememberedCollection());
      if (!accounts.length) toggleAccountsPanel(true);
    }

    async function addAccount() {
      $("account-error").textContent = "";
      try {
        const saved = await api("accounts", {
          method: "POST",
          body: JSON.stringify({ name: $("new-account-name").value, key: $("new-account-key").value }),
        });
        $("new-account-name").value = "";
        $("new-account-key").value = "";
        await loadAccounts();
        $("account-select").value = saved.id;
        onAccountChange();
      } catch (err) {
        $("account-error").textContent = err.message;
      }
    }

    function onAccountChange() {
      localStorage.setItem("account", selectedAccount());
      renderCollections(rememberedCollection());
    }

    function toggleAccountsPanel(open) {
      const panel = $("accounts-panel");
      panel.hidden = !open;
      $("manage-accounts").setAttribute("aria-expanded", String(open));
      if (open) $("new-account-name").focus();
    }

    // Last path segment of a collection URL, or the ID itself
    function collectionId(value) {
      return (value || "").trim().replace(/\/+$/, "").split("/").pop().toLowerCase();
    }

    function collectionName(id) {
      const found = savedCollections.find((c) => c.id === collectionId(id));
      return found ? found.name : id;
    }

    function selectedCollection() {
      const value = $("collection-select").value;
      return value === OTHER ? $("collection").value.trim() : value;
    }

    // Show `value` (saved ID, pasted link, or empty) in the dropdown
    function selectCollection(value) {
      const id = collectionId(value);
      const saved = accountCollections().some((c) => c.id === id);
      $("collection-select").value = !value ? "" : saved ? id : OTHER;
      $("collection").value = saved || !value ? "" : value;
      $("collection").hidden = $("collection-select").value !== OTHER;
    }

    function renderCollections(selected = selectedCollection()) {
      const mine = accountCollections();
      $("collections-account-name").textContent = accountName(selectedAccount());
      $("collection-select").replaceChildren(
        el("option", { value: "" }, "No collection"),
        ...mine.map((c) => el("option", { value: c.id }, c.name)),
        el("option", { value: OTHER }, "Other link…"),
      );
      selectCollection(selected);

      $("collection-list").replaceChildren(...(mine.length ? mine.map((c) => {
        const remove = el("button", { type: "button", className: "small", title: `Remove ${c.name}` }, "Remove");
        remove.addEventListener("click", async () => {
          if (!confirm(`Remove saved collection "${c.name}"? The collection in Slink is not affected.`)) return;
          try {
            await api(`collections/${c.id}`, { method: "DELETE" });
            await loadCollections();
          } catch (err) {
            $("collection-error").textContent = err.message;
          }
        });
        return el("li", {}, el("span", {}, el("b", {}, c.name), el("small", {}, c.id)), remove);
      }) : [el("li", { className: "hint" }, "None saved yet")]));
    }

    async function loadCollections(selected) {
      savedCollections = await api("collections");
      renderCollections(selected);
    }

    async function addCollection() {
      $("collection-error").textContent = "";
      try {
        const saved = await api("collections", {
          method: "POST",
          body: JSON.stringify({
            name: $("new-collection-name").value,
            link: $("new-collection-link").value,
            account: selectedAccount(),
          }),
        });
        $("new-collection-name").value = "";
        $("new-collection-link").value = "";
        await loadCollections(saved.id);
      } catch (err) {
        $("collection-error").textContent = err.message;
      }
    }

    async function api(path, options = {}) {
      const resp = await fetch(`api/${path}`, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
      });
      if (resp.status === 401) {
        location.href = "login";
        throw new Error("login required");
      }
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        const detail = Array.isArray(data.detail) ? data.detail.map((d) => d.msg).join(", ") : data.detail;
        throw new Error(detail || `Error ${resp.status}`);
      }
      return data;
    }

    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleString();
    }

    function summaryText(counts) {
      const parts = [`${counts.ok} ok`, `${counts.failed} failed`];
      if (counts.skipped) parts.push(`${counts.skipped} skipped`);
      return `${counts.total} links · ${parts.join(" · ")}`;
    }

    function renderJob(job) {
      currentJob = job;
      const c = job.counts;
      const finished = c.ok + c.failed + c.skipped;
      $("job").hidden = false;
      $("job-title").textContent =
        job.status === "running" ? "Importing…" :
        job.status === "queued" ? "Queued" :
        job.status === "interrupted" ? "Interrupted" :
        job.status === "error" ? "Stopped with an error" : "Import finished";
      $("job-bar").style.width = c.total ? `${(finished / c.total) * 100}%` : "0";

      $("job-summary").replaceChildren(
        ...[["Done", `${finished}/${c.total}`], ["OK", c.ok], ["Failed", c.failed], ["Skipped", c.skipped],
            ["Account", job.account.name],
            ["Collection", job.options.collectionIds.map(collectionName).join(", ") || "none"],
            ["Started", formatTime(job.created)]]
          .map(([k, v]) => el("span", {}, `${k}: `, el("b", {}, String(v))))
      );

      const active = job.status === "running" || job.status === "queued";
      $("retry").hidden = active || c.failed === 0;
      $("download-failed").hidden = c.failed === 0;
      $("download-failed").href = `api/jobs/${job.id}/failed-links.txt`;
      $("copy-urls").hidden = c.ok + c.skipped === 0;

      $("job-items").replaceChildren(...job.items.map((item) => {
        const linkCell = el("td", { className: "link" }, item.link);
        if (item.error) linkCell.append(el("small", {}, item.error));
        const slinkCell = el("td");
        if (item.url) slinkCell.append(el("a", { href: item.url, target: "_blank", rel: "noopener" }, item.url.replace(/^https?:\/\/[^/]+\//, "")));
        return el("tr", {},
          el("td", {}, el("span", { className: `status ${item.status}` }, STATUS_LABEL[item.status] || item.status)),
          linkCell, slinkCell);
      }));

      clearTimeout(pollTimer);
      if (active) pollTimer = setTimeout(() => showJob(job.id), 1000);
      else loadHistory();
    }

    async function showJob(id) {
      try {
        renderJob(await api(`jobs/${id}`));
      } catch (err) {
        $("job-error").textContent = err.message;
        pollTimer = setTimeout(() => showJob(id), 3000);
      }
    }

    async function loadHistory() {
      const jobs = await api("jobs");
      if (!jobs.length) return;
      $("history").replaceChildren(...jobs.map((job) => {
        const li = el("li", {},
          el("span", { className: `status ${job.status === "done" ? (job.counts.failed ? "failed" : "ok") : job.status}` },
            job.status === "done" ? (job.counts.failed ? "Some failed" : "Done") : job.status),
          ` · ${formatTime(job.created)} · ${job.account.name} · ${summaryText(job.counts)}`);
        li.addEventListener("click", () => { $("job-error").textContent = ""; showJob(job.id); });
        return li;
      }));
      return jobs;
    }

    $("import-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("form-error").textContent = "";
      $("submit").disabled = true;
      try {
        const collection = selectedCollection();
        const job = await api("jobs", {
          method: "POST",
          body: JSON.stringify({
            links: $("links").value,
            account: selectedAccount(),
            public: $("public").checked,
            collection,
            description: $("description").value,
            workers: Number($("workers").value) || null,
            force: $("force").checked,
          }),
        });
        localStorage.setItem(`collection:${selectedAccount()}`, collection);
        localStorage.setItem("public", $("public").checked ? "1" : "0");
        $("links").value = "";
        $("force").checked = false;
        renderJob(job);
      } catch (err) {
        $("form-error").textContent = err.message;
      } finally {
        $("submit").disabled = !accounts.length;
      }
    });

    $("retry").addEventListener("click", async () => {
      $("job-error").textContent = "";
      try {
        renderJob(await api(`jobs/${currentJob.id}/retry`, { method: "POST", body: "{}" }));
      } catch (err) {
        $("job-error").textContent = err.message;
      }
    });

    $("copy-urls").addEventListener("click", async () => {
      const urls = currentJob.items.filter((i) => i.url).map((i) => i.url).join("\n");
      await navigator.clipboard.writeText(urls);
      $("copy-urls").textContent = "Copied!";
      setTimeout(() => ($("copy-urls").textContent = "Copy Slink URLs"), 1500);
    });

    $("collection-select").addEventListener("change", () => {
      const other = $("collection-select").value === OTHER;
      $("collection").hidden = !other;
      if (other) $("collection").focus();
    });

    $("manage-collections").addEventListener("click", () => {
      const panel = $("collections-panel");
      panel.hidden = !panel.hidden;
      $("manage-collections").setAttribute("aria-expanded", String(!panel.hidden));
      if (panel.hidden) return;
      // Offer to save a pasted link that isn't saved yet
      if ($("collection-select").value === OTHER && $("collection").value.trim()) {
        $("new-collection-link").value = $("collection").value.trim();
      }
      $("new-collection-name").focus();
    });

    $("account-select").addEventListener("change", onAccountChange);
    $("manage-accounts").addEventListener("click", () => toggleAccountsPanel($("accounts-panel").hidden));
    $("add-account").addEventListener("click", addAccount);
    $("add-collection").addEventListener("click", addCollection);

    // Enter in the "add" fields saves instead of submitting the import form
    const enterActions = {
      "new-collection-name": addCollection,
      "new-collection-link": addCollection,
      "new-account-name": addAccount,
      "new-account-key": addAccount,
    };
    for (const [id, action] of Object.entries(enterActions)) {
      $(id).addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          action();
        }
      });
    }

    $("logout").addEventListener("click", async () => {
      await fetch("auth/logout", { method: "POST" });
      location.href = "login";
    });

    (async () => {
      const config = await api("config");
      $("slink-link").href = config.slinkUrl;
      $("workers").value = config.workers;
      $("workers").max = config.maxWorkers;
      defaultCollection = config.defaultCollection;
      await loadAccounts();
      const savedPublic = localStorage.getItem("public");
      $(savedPublic === null ? (config.defaultPublic ? "public" : "private") : savedPublic === "1" ? "public" : "private").checked = true;

      const jobs = await loadHistory();
      const active = jobs && jobs.find((j) => j.status === "running" || j.status === "queued");
      if (active) showJob(active.id);
    })();
  </script>
</body>
</html>
